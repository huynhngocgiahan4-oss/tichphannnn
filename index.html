<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tích Phân Trực Quan Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.30.0/plotly.min.js"></script>

    <style>
        :root {
            --bg: #0d0f14;
            --surface: #13161e;
            --surface2: #1a1e2a;
            --border: rgba(255,255,255,0.07);
            --border2: rgba(255,255,255,0.13);
            --text: #e8eaf0;
            --muted: #7a8099;
            --accent: #6c63ff;
            --a2: #00e5b0;
            --r: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Be Vietnam Pro', sans-serif; 
            min-height: 100vh;
            line-height: 1.6;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-family: 'DM Serif Display', serif; font-size: 3rem; margin-bottom: 10px; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .tabs { display: flex; gap: 8px; background: var(--surface); padding: 6px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 30px; overflow-x: auto; }
        .tab { flex: 1; min-width: 120px; padding: 12px; border: none; background: transparent; color: var(--muted); cursor: pointer; border-radius: 8px; font-weight: 500; white-space: nowrap; transition: 0.3s; }
        .tab.active { background: var(--accent); color: #fff; box-shadow: 0 4px 15px rgba(108,99,255,0.3); }

        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.4s ease; }

        .input-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        .field label { font-family: 'DM Mono', monospace; font-size: 0.75rem; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; }
        .field input { background: var(--surface2); border: 1px solid var(--border2); padding: 12px; border-radius: 8px; color: #fff; font-family: 'DM Mono', monospace; outline: none; }
        .field input:focus { border-color: var(--accent); }

        .btn-run { background: linear-gradient(135deg, var(--accent), #8b83ff); color: #fff; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 25px; transition: 0.3s; }
        .btn-run:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(108,99,255,0.4); }

        .canvas-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 20px; position: relative; }
        canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
        #plot3d { width: 100%; height: 500px; border-radius: 8px; }

        .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { background: var(--surface2); padding: 20px; border-radius: var(--r); border: 1px solid var(--border); }
        .card label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; display: block; }
        .card .val { font-family: 'DM Mono', monospace; font-size: 1.4rem; color: var(--a2); font-weight: 600; }

        .formula { background: rgba(108,99,255,0.05); padding: 15px; border-radius: 10px; border-left: 4px solid var(--accent); margin-bottom: 20px; font-family: 'DM Mono', monospace; color: var(--muted); }
        .formula b { color: var(--a2); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Tích Phân Đa Năng</h1>
        <p style="color: var(--muted)">Công cụ giải tích và trực quan hóa chuyên sâu</p>
    </header>

    <div class="tabs" id="maintabs">
        <button class="tab active" onclick="switchTab('t1', this)">Diện tích</button>
        <button class="tab" onclick="switchTab('t2', this)">Độ dài cung</button>
        <button class="tab" onclick="switchTab('t3', this)">Xoay Ox (3D)</button>
        <button class="tab" onclick="switchTab('t4', this)">Xoay Oy</button>
        <button class="tab" onclick="switchTab('t5', this)">Diện tích mặt</button>
    </div>

    <div id="t1" class="panel active">
        <div class="formula">Công thức: S = <b>∫ₐᵇ |f(x)| dx</b></div>
        <div class="input-group">
            <div class="field"><label>Hàm số f(x)</label><input id="f1" value="x^2 - 2x"></div>
            <div class="field"><label>Cận a</label><input id="a1" type="number" value="0"></div>
            <div class="field"><label>Cận b</label><input id="b1" type="number" value="3"></div>
        </div>
        <button class="btn-run" onclick="solveArea()">▶ Tính toán & Vẽ</button>
        <div class="canvas-card"><canvas id="c1" width="900" height="400"></canvas></div>
        <div class="results">
            <div class="card"><label>Diện tích S</label><div class="val" id="r1s">—</div></div>
        </div>
    </div>

    <div id="t2" class="panel">
        <div class="formula">Công thức: L = <b>∫ₐᵇ √(1 + [f'(x)]²) dx</b></div>
        <div class="input-group">
            <div class="field"><label>Hàm số f(x)</label><input id="f2" value="x^(3/2)"></div>
            <div class="field"><label>Cận a</label><input id="a2" type="number" value="0"></div>
            <div class="field"><label>Cận b</label><input id="b2" type="number" value="4"></div>
        </div>
        <button class="btn-run" onclick="solveArcLength()">▶ Tính toán & Vẽ</button>
        <div class="canvas-card"><canvas id="c2" width="900" height="400"></canvas></div>
        <div class="results">
            <div class="card"><label>Độ dài L</label><div class="val" id="r2l">—</div></div>
            <div class="card"><label>Đạo hàm f'(x)</label><div class="val" id="r2df" style="font-size:1rem">—</div></div>
        </div>
    </div>

    <div id="t3" class="panel">
        <div class="formula">Công thức: V = <b>π ∫ₐᵇ [f(x)]² dx</b></div>
        <div class="input-group">
            <div class="field"><label>Hàm số f(x)</label><input id="f3" value="sqrt(x)"></div>
            <div class="field"><label>Cận a</label><input id="a3" type="number" value="0"></div>
            <div class="field"><label>Cận b</label><input id="b3" type="number" value="4"></div>
        </div>
        <button class="btn-run" onclick="solveVolume3D()">▶ Dựng mô hình 3D</button>
        <div class="canvas-card"><div id="plot3d"></div></div>
        <div class="results">
            <div class="card"><label>Thể tích V</label><div class="val" id="r3v">—</div></div>
        </div>
    </div>

    <div id="t4" class="panel">
        <div class="formula">Công thức: V = <b>2π ∫ₐᵇ x |f(x)| dx</b></div>
        <div class="input-group">
            <div class="field"><label>Hàm số f(x)</label><input id="f4" value="sin(x)"></div>
            <div class="field"><label>Cận a</label><input id="a4" type="number" value="0"></div>
            <div class="field"><label>Cận b</label><input id="b4" type="number" value="3.14159"></div>
        </div>
        <button class="btn-run" onclick="solveVolumeOy()">▶ Tính toán</button>
        <div class="results">
            <div class="card"><label>Thể tích V (Oy)</label><div class="val" id="r4v">—</div></div>
        </div>
    </div>

    <div id="t5" class="panel">
        <div class="formula">Công thức: S = <b>2π ∫ₐᵇ |f(x)| √(1 + [f'(x)]²) dx</b></div>
        <div class="input-group">
            <div class="field"><label>Hàm số f(x)</label><input id="f5" value="sqrt(4 - x^2)"></div>
            <div class="field"><label>Cận a</label><input id="a5" type="number" value="-2"></div>
            <div class="field"><label>Cận b</label><input id="b5" type="number" value="2"></div>
        </div>
        <button class="btn-run" onclick="solveSurface()">▶ Tính toán</button>
        <div class="results">
            <div class="card"><label>Diện tích mặt S</label><div class="val" id="r5s">—</div></div>
        </div>
    </div>
</div>

<script>
    // --- CẤU HÌNH MATH.JS ---
    const parser = math.parser();

    function safeEval(expr, xVal) {
        try { return math.evaluate(expr, { x: xVal }); } catch { return NaN; }
    }

    function getDeriv(expr) {
        try { return math.derivative(expr, 'x'); } catch { return null; }
    }

    // --- CHUYỂN TAB ---
    function switchTab(id, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        if(id === 't3') solveVolume3D();
    }

    // --- VẼ CANVAS 2D CHUNG ---
    function draw2D(canvasId, fExpr, a, b, fillArea = false) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0,0,W,H);

        // Vẽ hệ trục tọa độ đơn giản
        const pad = 40;
        const scaleX = (W - 2*pad) / (b - a || 1);
        const tX = x => pad + (x - a) * scaleX;

        let ys = [];
        for(let i=0; i<=100; i++) {
            let y = safeEval(fExpr, a + (i/100)*(b-a));
            if(isFinite(y)) ys.push(y);
        }
        let minY = Math.min(...ys, 0), maxY = Math.max(...ys, 1);
        const scaleY = (H - 2*pad) / (maxY - minY || 1);
        const tY = y => H - pad - (y - minY) * scaleY;

        // Vẽ đường cong
        ctx.beginPath();
        ctx.strokeStyle = '#00e5b0';
        ctx.lineWidth = 3;
        for(let i=0; i<=200; i++){
            let x = a + (i/200)*(b-a);
            let y = safeEval(fExpr, x);
            if(i===0) ctx.moveTo(tX(x), tY(y)); else ctx.lineTo(tX(x), tY(y));
        }
        ctx.stroke();

        if(fillArea) {
            ctx.lineTo(tX(b), tY(0));
            ctx.lineTo(tX(a), tY(0));
            ctx.fillStyle = 'rgba(108,99,255,0.2)';
            ctx.fill();
        }
    }

    // --- LOGIC CHI TIẾT ---
    function solveArea() {
        const f = document.getElementById('f1').value;
        const a = parseFloat(document.getElementById('a1').value);
        const b = parseFloat(document.getElementById('b1').value);
        
        let sum = 0, steps = 1000, dx = (b-a)/steps;
        for(let i=0; i<steps; i++) sum += Math.abs(safeEval(f, a + i*dx)) * dx;
        
        document.getElementById('r1s').textContent = sum.toFixed(5);
        draw2D('c1', f, a, b, true);
    }

    function solveArcLength() {
        const f = document.getElementById('f2').value;
        const a = parseFloat(document.getElementById('a2').value);
        const b = parseFloat(document.getElementById('b2').value);
        const df = getDeriv(f);

        if(!df) return;
        document.getElementById('r2df').textContent = "f'(x) = " + df.toString();

        let L = 0, steps = 1000, dx = (b-a)/steps;
        for(let i=0; i<steps; i++){
            let dVal = df.evaluate({x: a + i*dx});
            L += Math.sqrt(1 + dVal*dVal) * dx;
        }
        document.getElementById('r2l').textContent = L.toFixed(5);
        draw2D('c2', f, a, b);
    }

    function solveVolume3D() {
        if (typeof Plotly === 'undefined') return;

        const fE = document.getElementById('f3').value;
        const a = parseFloat(document.getElementById('a3').value);
        const b = parseFloat(document.getElementById('b3').value);
        
        // Dữ liệu Plotly
        let xArr = [], yArr = [], zArr = [];
        let n = 40, m = 40;
        for(let i=0; i<=n; i++){
            let x = a + (i/n)*(b-a);
            let r = Math.abs(safeEval(fE, x));
            let xRow = [], yRow = [], zRow = [];
            for(let j=0; j<=m; j++){
                let phi = (j/m) * 2 * Math.PI;
                xRow.push(x);
                yRow.push(r * Math.cos(phi));
                zRow.push(r * Math.sin(phi));
            }
            xArr.push(xRow); yArr.push(yRow); zArr.push(zRow);
        }

        const data = [{ type: 'surface', x: xArr, y: yArr, z: zArr, colorscale: 'Viridis' }];
        Plotly.newPlot('plot3d', data, { 
            paper_bgcolor: 'rgba(0,0,0,0)', 
            plot_bgcolor: 'rgba(0,0,0,0)',
            margin: {l:0,r:0,b:0,t:0},
            scene: { xaxis:{color:'#7a8099'}, yaxis:{color:'#7a8099'}, zaxis:{color:'#7a8099'} }
        });

        // Tính V
        let V = 0, steps = 1000, dx = (b-a)/steps;
        for(let i=0; i<steps; i++) {
            let y = safeEval(fE, a + i*dx);
            V += Math.PI * y * y * dx;
        }
        document.getElementById('r3v').textContent = V.toFixed(5);
    }

    function solveVolumeOy() {
        const f = document.getElementById('f4').value;
        const a = parseFloat(document.getElementById('a4').value);
        const b = parseFloat(document.getElementById('b4').value);
        let V = 0, steps = 1000, dx = (b-a)/steps;
        for(let i=0; i<steps; i++){
            let x = a + i*dx;
            V += 2 * Math.PI * x * Math.abs(safeEval(f, x)) * dx;
        }
        document.getElementById('r4v').textContent = V.toFixed(5);
    }

    function solveSurface() {
        const f = document.getElementById('f5').value;
        const a = parseFloat(document.getElementById('a5').value);
        const b = parseFloat(document.getElementById('b5').value);
        const df = getDeriv(f);
        let S = 0, steps = 1000, dx = (b-a)/steps;
        for(let i=0; i<steps; i++){
            let x = a + i*dx;
            let y = Math.abs(safeEval(f, x));
            let dVal = df.evaluate({x: x});
            S += 2 * Math.PI * y * Math.sqrt(1 + dVal*dVal) * dx;
        }
        document.getElementById('r5s').textContent = S.toFixed(5);
    }

    // Khởi tạo
    window.onload = solveArea;
</script>

</body>
</html>
